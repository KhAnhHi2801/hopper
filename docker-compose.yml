services:
  redis:
    image: redis:7
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']

  mongo:
    image: mongo:7
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']

  printify-service:
    build:
      context: .
      dockerfile: services/printify-service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - services/printify-service/.env
    ports:
      - '3000:3000'
